name: Go CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: ['1.20', '1.24', '1.26']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Debug Go setup
        run: |
          echo "PATH=$PATH"
          command -v go
          go version
          go env GOMOD GOPATH GOROOT

      - name: Download module dependencies
        env:
          GO111MODULE: on
        run: |
          echo "Using go:" $(command -v go)
          go version
          go mod download

      - name: Verify module dependencies
        run: go mod verify

      - name: Run gofmt
        run: gofmt -w .

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...
